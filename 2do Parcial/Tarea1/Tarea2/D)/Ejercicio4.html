<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    <h1>Calculadora de TMB</h1>
    <form action="Ejercicio4.php" method="post">

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" step="0.1" required><br><br>

        <label for="altura">Altura (cm):</label>
        <input type="number" id="altura" name="altura" step="0.1" required><br><br>

        <label for="edad">Edad (años):</label>
        <input type="number" id="edad" name="edad" required><br><br>

        <label for="sexo">Sexo:</label>
        <select id="sexo" name="sexo" required>
            <option value="">Seleccione...</option>
            <option value="hombre">Hombre</option>
            <option value="mujer">Mujer</option>
        </select><br><br>

        <label for="nivelActividad">Nivel de actividad física:</label>
        <select id="nivelActividad" name="nivelActividad" required>
            <option value="">Seleccione...</option>
            <option value="sedentario">Sedentario (poco o nada de ejercicio)</option>
            <option value="ligero">Ligero (ejercicio 1-3 días/semana)</option>
            <option value="moderado">Moderado (ejercicio 3-5 días/semana)</option>
            <option value="activo">Activo (ejercicio 6-7 días/semana)</option>
        </select><br><br>

        <input type="submit" value="Calcular TMB">
    </form>

</body>
</html>
