<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo 1</title>
</head>
<body>
    <h1>Ejemplo 1</h1><br>
    <h2>Realiza un programa que permita al usuario ingresar su nombre y edad a traves de un formulario HTML utilizando el metodo Get, y luego muestre un mensaje de bienvenida con la informacion ingresada. </h2><br>
    <h3>Formulario:</h3>
    <form action="Ejemplo1.php" method="get">
        <label>Nombre:</label>
        <input type="text" name="nombre"><br>
        <label>Edad:</label>
        <input type="number" name="edad"><br>
        <input type="submit" value="Enviar">

    </form>
</body>
</html>
